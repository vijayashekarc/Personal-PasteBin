<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Pure Flat Shadows -->
  <defs>
    <!-- Sharp Solid Drop Shadow for Maximum Silhouette Cleanliness -->
    <filter id="flat-heavy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Clean Minimalist Backdrop Canvas -->
  <rect width="512" height="512" fill="#FAFAFA"/>

  <!-- Luxury App Icon Centered Frame -->
  <g transform="translate(136, 116)" filter="url(#flat-heavy-shadow)">
    
    <!-- Outer Base Canvas Container (Solid Obsidian Matte Black Notebook) -->
    <rect width="240" height="280" rx="36" fill="#121318" />

    <!-- Left Column Spine (Solid Dark Architectural Accent Layer) -->
    <path d="M 0,36 A 36,36 0 0 1 36,0 L 56,0 L 56,280 L 36,280 A 36,36 0 0 1 0,244 Z" fill="#090A0D" />

    <!-- Minimal Dark Mode UI Content Lines (Solid Stealth Anchors) -->
    <rect x="88" y="76" width="96" height="8" rx="4" fill="#FFFFFF" opacity="0.1" />
    <rect x="88" y="112" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.1" />

    <!-- Heavy Weight Solid Hyper-Bright Neon Green Checkmark Layer -->
    <!-- Expanded thickness stroke-width="24" with flat color hex for raw contrast -->
    <path d="M 125,185 L 165,225 L 265,90" fill="none" stroke="#00FF66" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
