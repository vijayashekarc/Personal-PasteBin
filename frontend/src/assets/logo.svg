<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for Pure Flat Shadows -->
  <defs>
    <!-- Sharp Drop Shadow -->
    <filter id="flat-heavy-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0369A1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Clean Minimalist Backdrop Canvas -->
  <rect width="512" height="512" fill="#FFFFFF" rx="64"/>

  <!-- Luxury App Icon Centered Frame -->
  <g transform="translate(136, 116)" filter="url(#flat-heavy-shadow)">
    
    <!-- Outer Base Canvas Container (Light Blue Notebook) -->
    <rect width="240" height="280" rx="36" fill="#0284C7" />

    <!-- Left Column Spine (Darker Blue Accent Layer) -->
    <path d="M 0,36 A 36,36 0 0 1 36,0 L 56,0 L 56,280 L 36,280 A 36,36 0 0 1 0,244 Z" fill="#0369A1" />

    <!-- Minimal UI Content Lines -->
    <rect x="88" y="76" width="96" height="8" rx="4" fill="#FFFFFF" opacity="0.4" />
    <rect x="88" y="112" width="64" height="8" rx="4" fill="#FFFFFF" opacity="0.4" />

    <!-- Vibrant Solid Green Checkmark Layer -->
    <path d="M 125,185 L 165,225 L 265,90" fill="none" stroke="#00FF66" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
